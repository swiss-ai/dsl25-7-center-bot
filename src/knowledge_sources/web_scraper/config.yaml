# Web Scraper Knowledge Source Configuration
name: web_scraper
enabled: true
description: "Scrapes and indexes web content from specified URLs"

# Scraping targets
targets:
  # Static list of URLs
  urls: []
  
  # URL patterns to crawl
  patterns: []
  
  # Sitemaps to process
  sitemaps: []
  
  # RSS/Atom feeds
  feeds: []

# Scraping configuration
scraping:
  # User agent string
  user_agent: "SlackBot-WebScraper/1.0"
  # Request timeout in seconds
  timeout: 30
  # Retry attempts
  max_retries: 3
  # Delay between requests in seconds
  request_delay: 1
  # Maximum concurrent requests
  max_concurrent: 5
  # Follow redirects
  follow_redirects: true
  # Maximum redirect depth
  max_redirects: 5
  # Respect robots.txt
  respect_robots: true
  # JavaScript rendering
  render_javascript: false
  # Headers to send
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.5"

# Content extraction
extraction:
  # CSS selectors for content
  content_selectors:
    - "main"
    - "article"
    - ".content"
    - "#content"
  # CSS selectors to exclude
  exclude_selectors:
    - "nav"
    - "header"
    - "footer"
    - ".sidebar"
    - ".advertisement"
    - "script"
    - "style"
  # Extract metadata
  extract_metadata: true
  # Extract links
  extract_links: true
  # Extract images
  extract_images: false
  # Clean HTML
  clean_html: true
  # Convert to markdown
  convert_markdown: true

# Crawling configuration
crawling:
  # Maximum crawl depth
  max_depth: 3
  # Maximum pages per domain
  max_pages_per_domain: 1000
  # URL patterns to follow
  follow_patterns: []
  # URL patterns to exclude
  exclude_patterns:
    - ".*\\.pdf$"
    - ".*\\.zip$"
    - ".*\\.exe$"
    - ".*/print/.*"
    - ".*/download/.*"
  # Domain restrictions
  allowed_domains: []
  # Stay within same domain
  same_domain_only: true

# Indexing configuration
indexing:
  # How often to re-scrape in hours
  update_interval: 24
  # Batch size for indexing
  batch_size: 50
  # Detect content changes
  detect_changes: true
  # Minimum content length
  min_content_length: 100
  # Maximum content length
  max_content_length: 50000
  # Language detection
  detect_language: true
  # Accepted languages
  accepted_languages:
    - "en"

# Search configuration
search:
  # Maximum results to return
  max_results: 10
  # Include page title
  include_title: true
  # Include URL
  include_url: true
  # Include domain
  include_domain: true
  # Include publish date
  include_date: true
  # Snippet length
  snippet_length: 300